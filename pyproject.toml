[project]
name = "mvrl"
version = "0.1.0"
description = "Reference machinery for measuring the surrogate gap in reinforcement learning for asset allocation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
research = ["pandas>=2", "matplotlib>=3.8", "scikit-learn>=1.3", "torch>=2.2", "gymnasium>=1", "stable-baselines3>=2.4"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mvrl"]
