name: Research checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU research dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[research,test]' pypdf
      - name: Run all research tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          MPLCONFIGDIR: /tmp/mvrl-matplotlib
        run: python -m pytest -q
      - name: Check current submission
        run: python scripts/check_manuscript.py
